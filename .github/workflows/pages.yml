name: Publish Brooke web

# Publishes the web/ folder to GitHub Pages whenever it changes.
on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### ✅ Brooke опубликован: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
